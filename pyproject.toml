[project]
name = "nosql-lab"
version = "0.1.0"
description = "NoSQL work for DS2022"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.7.22",
    "pymongo>=4.18.2",
]

[project.scripts]
nosql-lab = "nosql_lab:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
